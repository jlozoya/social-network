# Integración continua.
#
# Se ejecuta en cada rama y en cada pull request. Cuatro trabajos en paralelo:
#
# - checks: tipos, lint —ESLint, Stylelint, traducciones y formato con
#           Prettier— y pruebas unitarias de los tres paquetes.
# - infra:  los flujos de GitHub, los Dockerfile y los guiones de shell.
# - e2e:    la API entera contra un Mongo de verdad, recorriendo sesiones,
#           2FA, subidas, chat, historias y OAuth por GraphQL.
# - build:  compila API y aplicación como se compilan para desplegar.
#
# `deploy.yml` sólo publica lo que ha pasado por aquí.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  sites:
    name: Sites — tipos, privacidad y compilaciones
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/social-network
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sites/social-network/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:backend
      - run: npm run build
      - run: npm run build:mobile
        env:
          SOCIAL_NETWORK_SITES_URL: https://social-network-lozoya.neatloon16.chatgpt.site

  checks:
    name: Tipos, lint y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar los contratos compartidos
        run: npm run build:shared

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias de la API
        run: npm run test:api

  infra:
    name: Flujos, Dockerfile y guiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # actionlint, hadolint y shellcheck, cada uno en su imagen de Docker con
      # la versión fijada: lo mismo que `npm run lint:infra` en local.
      - name: Revisar
        run: node scripts/lint-infra.mjs

  e2e:
    name: Pruebas de extremo a extremo
    # MongoDB 8 no arranca con los kernels 6.19+ de Ubuntu 26.04.
    # https://jira.mongodb.org/browse/SERVER-121912
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar los contratos compartidos
        run: npm run build:shared

      - name: Ejecutar
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: mongodb://127.0.0.1:27017/social_network_e2e?directConnection=true

      - name: El esquema versionado coincide con el código
        # Al arrancar, la API reescribe `schema.gql` a partir de las clases. Si
        # el del repositorio no coincide, alguien cambió el contrato público
        # sin que se viera en la revisión.
        run: git diff --exit-code -- apps/api/schema.gql

  build:
    name: Compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: |
          npm run build:shared
          npm run build:api
          npm run build:mobile
