# Compilación de la app de Android.
#
# Se lanza a mano o al etiquetar una versión (`v2.1.0`). Genera siempre un APK
# de depuración para probar, y, si están configurados los secretos de firma, un
# APK y un AAB de publicación firmados listos para Google Play:
#
#   ANDROID_KEYSTORE_BASE64    el almacén de claves (.jks) en base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# La carpeta `android/` no se versiona: se regenera aquí con Capacitor.

name: Android

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend de la aplicación
        type: choice
        options: [sites, legacy]
        default: sites
  push:
    branches: ['fernando/play-internal-*']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_BACKEND: ${{ inputs.backend == 'legacy' && 'legacy' || 'sites' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la aplicación
        run: |
          if [ "$APP_BACKEND" = "sites" ]; then
            cd sites/social-network
            npm ci
            npm run typecheck
            npm run test:backend
            SOCIAL_NETWORK_SITES_URL="https://social-network-lozoya.neatloon16.chatgpt.site" npm run build:mobile
          else
            npm run build:shared
            npm run build:prod --workspace @social-network/mobile
          fi

      - name: Generar el proyecto de Android
        working-directory: apps/mobile
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "$APP_BACKEND" = "sites" ]; then
            export SOCIAL_NETWORK_SITES_URL="https://social-network-lozoya.neatloon16.chatgpt.site"
          fi
          npx cap add android
          npx cap sync android
          node scripts/configure-sites-android.mjs

      - name: Compilar
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Firmar
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/mobile/android/app/build/outputs
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"

          "$BUILD_TOOLS/zipalign" -f 4 apk/release/app-release-unsigned.apk apk/release/app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out apk/release/social-network-release.apk apk/release/app-release-aligned.apk

          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            bundle/release/app-release.aab "$KEY_ALIAS"

          rm "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: social-network-android
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/social-network-release.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
